<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; height: 100%;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: flex-start; padding: 8px; box-sizing: border-box; }
    .toast {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px;
      background: #000; color: #fff; border: 1px solid #2a2a2a; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.6);
      transform: translateX(120%); opacity: 0;
      transition: transform .45s cubic-bezier(.2,.9,.2,1), opacity .3s;
      min-width: 240px; max-width: 360px; position: relative; overflow: hidden;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
    .badge { width: 40px; height: 40px; border-radius: 10px; background: #fff; color: #000;
      display: grid; place-items: center; flex: none; }
    .badge svg { width: 20px; height: 20px; }
    .toast.error .badge { background: #000; color: #fff; border: 1px solid #fff; }
    .t { font-size: 14px; font-weight: 650; letter-spacing: .01em; }
    .s { font-size: 12px; color: #8d8d8d; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
      font-family: "Cascadia Mono", Consolas, monospace; }
    .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: #fff; width: 0; }
    .toast.progress .bar { animation: load 1.4s ease-in-out infinite; }
    .toast.done .bar { width: 100%; animation: drain 2.6s linear forwards; }
    @keyframes load { 0% { left: 0; width: 0 } 50% { left: 20%; width: 60% } 100% { left: 100%; width: 0 } }
    @keyframes drain { from { width: 100% } to { width: 0 } }
    .spin { animation: spin 1s linear infinite; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toast" id="toast">
      <div class="badge" id="badge"></div>
      <div><div class="t" id="title"></div><div class="s" id="sub"></div></div>
      <div class="bar"></div>
    </div>
  </div>
  <script src="toast.js"></script>
</body>
</html>
